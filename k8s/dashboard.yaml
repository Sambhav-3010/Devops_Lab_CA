apiVersion: v1
kind: ConfigMap
metadata:
  name: workload-reliability-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  workload-reliability.json: |
    {
      "uid": "workload-reliability",
      "title": "Kubernetes Workload Reliability",
      "description": "SLO-oriented dashboard for the workload-lab demo application",
      "tags": ["kubernetes", "prometheus", "slo", "devops"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": {"from": "now-30m", "to": "now"},
      "panels": [
        {"id": 1, "title": "Availability SLI (85% SLO)", "type": "stat", "gridPos": {"h": 5, "w": 6, "x": 0, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "100 * (1 - (sum(rate(demo_http_requests_total{namespace=\"workload-lab\",status=~\"5..\"}[5m])) or vector(0)) / clamp_min(sum(rate(demo_http_requests_total{namespace=\"workload-lab\"}[5m])), 0.001))", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "yellow", "value": 85}, {"color": "green", "value": 95}]}}}, "options": {"colorMode": "background", "graphMode": "area", "justifyMode": "center", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}},
        {"id": 2, "title": "Error Budget Remaining (85% SLO)", "type": "stat", "gridPos": {"h": 5, "w": 6, "x": 6, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "clamp_min(clamp_max(100 * (1 - (((sum(rate(demo_http_requests_total{namespace=\"workload-lab\",status=~\"5..\"}[5m])) or vector(0)) / clamp_min(sum(rate(demo_http_requests_total{namespace=\"workload-lab\"}[5m])), 0.001)) / 0.15)), 100), 0)", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}}, "options": {"colorMode": "background", "graphMode": "area", "justifyMode": "center", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}},
        {"id": 3, "title": "p95 Latency", "type": "stat", "gridPos": {"h": 5, "w": 6, "x": 12, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(demo_http_request_duration_seconds_bucket{namespace=\"workload-lab\"}[5m])))", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "s", "decimals": 3}}, "options": {"colorMode": "background", "graphMode": "area", "justifyMode": "center", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}},
        {"id": 4, "title": "Application Service State", "type": "stat", "gridPos": {"h": 5, "w": 6, "x": 18, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "clamp_max((sum(kube_deployment_status_replicas_available{namespace=\"workload-lab\",deployment=\"demo-app\"}) or vector(0)), 1)", "refId": "A"}], "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {"0": {"text": "DOWN", "color": "red"}, "1": {"text": "UP", "color": "green"}}}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}}, "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "center", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}},
        {"id": 5, "title": "Node.js CPU Usage", "type": "timeseries", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 5}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "100 * rate(demo_nodejs_process_cpu_seconds_total{namespace=\"workload-lab\"}[2m]) / 0.25", "legendFormat": "{{instance}}", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}}, "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}},
        {"id": 6, "title": "Node.js Memory Usage", "type": "timeseries", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 5}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "100 * demo_nodejs_process_resident_memory_bytes{namespace=\"workload-lab\"} / 268435456", "legendFormat": "{{instance}}", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}}, "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}},
        {"id": 7, "title": "Requests by Status", "type": "timeseries", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 13}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum by (status) (rate(demo_http_requests_total{namespace=\"workload-lab\"}[2m]))", "legendFormat": "HTTP {{status}}", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "reqps", "min": 0}}, "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}},
        {"id": 8, "title": "Availability, p95 and p99 Latency", "type": "timeseries", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 13}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "100 * (1 - (sum(rate(demo_http_requests_total{namespace=\"workload-lab\",status=~\"5..\"}[5m])) or vector(0)) / clamp_min(sum(rate(demo_http_requests_total{namespace=\"workload-lab\"}[5m])), 0.001))", "legendFormat": "Availability %", "refId": "A"}, {"expr": "1000 * histogram_quantile(0.95, sum by (le) (rate(demo_http_request_duration_seconds_bucket{namespace=\"workload-lab\"}[5m])))", "legendFormat": "p95 latency (ms)", "refId": "B"}, {"expr": "1000 * histogram_quantile(0.99, sum by (le) (rate(demo_http_request_duration_seconds_bucket{namespace=\"workload-lab\"}[5m])))", "legendFormat": "p99 latency (ms)", "refId": "C"}], "fieldConfig": {"defaults": {"unit": "short", "min": 0}}, "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}},
        {"id": 9, "title": "Replicas and Restarts", "type": "timeseries", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 21}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "kube_deployment_status_replicas_available{namespace=\"workload-lab\",deployment=\"demo-app\"}", "legendFormat": "available replicas", "refId": "A"}, {"expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"workload-lab\",container=\"demo-app\"}[15m]))", "legendFormat": "restarts / 15m", "refId": "B"}], "fieldConfig": {"defaults": {"unit": "short", "min": 0}}, "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}},
        {"id": 10, "title": "HTTP 5xx Error Rate", "type": "timeseries", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 21}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "100 * (sum(rate(demo_http_requests_total{namespace=\"workload-lab\",status=~\"5..\"}[5m])) or vector(0)) / clamp_min(sum(rate(demo_http_requests_total{namespace=\"workload-lab\"}[5m])), 0.001)", "legendFormat": "5xx error rate", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}}, "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}}
      ]
    }
